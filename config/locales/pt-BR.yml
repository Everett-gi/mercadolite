# Traduções do MercadoLite. As mensagens padrão do Rails (validações, datas, moeda)
# vêm da gem rails-i18n; aqui ficam só os nomes do nosso domínio e as nossas mensagens.
pt-BR:
  activerecord:
    models:
      vendor:
        one: Vendedor
        other: Vendedores
      product:
        one: Produto
        other: Produtos
      inventory:
        one: Estoque
        other: Estoques
      cart:
        one: Carrinho
        other: Carrinhos
      cart_item:
        one: Item do carrinho
        other: Itens do carrinho
      user:
        one: Conta
        other: Contas
    attributes:
      vendor:
        name: Nome
        description: Descrição
        products: produtos
      product:
        name: Nome
        description: Descrição
        price_cents: Preço
        active: Ativo
        images: Imagens
        vendor: Vendedor
      inventory:
        quantity: Quantidade
      cart_item:
        quantity: Quantidade
        product: Produto
      user:
        email: E-mail
        password: Senha
        password_confirmation: Confirmação da senha
        current_password: Senha atual
        terms_of_service: Os Termos de Uso e a Política de Privacidade
    errors:
      models:
        product:
          attributes:
            images:
              too_many: "podem ser no máximo %{count}"
              invalid_type: "— %{filename} não é JPEG, PNG nem WebP"
              too_large: "— %{filename} passa de %{max_mb} MB"
        cart_item:
          attributes:
            product:
              unavailable: "não está mais à venda"
            quantity:
              exceeds_stock:
                one: "maior que o estoque (só resta %{count} unidade)"
                other: "maior que o estoque (só restam %{count} unidades)"
        user:
          attributes:
            password:
              # A rails-i18n diz "é muito curto"; "senha" é feminino.
              too_short: "é muito curta (mínimo: %{count} caracteres)"
              too_long: "é muito longa (máximo: %{count} caracteres)"
              too_many_bytes: "é longa demais: use até %{count} bytes (letras com acento contam 2)"
              predictable_repetitive: "é repetitiva demais: use mais caracteres diferentes"
              predictable_service_name: "não pode conter o nome da loja"
              predictable_email: "não pode conter o seu e-mail"
            terms_of_service:
              accepted: "precisam ser aceitos"

  activemodel:
    attributes:
      product_search:
        q: Busca
        vendor_id: Vendedor
        min_price: Preço mínimo
        max_price: Preço máximo
        in_stock: Somente em estoque
        sort: Ordenação
    errors:
      models:
        product_search:
          attributes:
            min_price:
              invalid_price: "deve ser um valor como 49,90"
            max_price:
              invalid_price: "deve ser um valor como 49,90"
              less_than_min_price: "não pode ser menor que o preço mínimo"

  # Mensagens dos controllers (t(".chave") dentro da ação procura em controller.ação.chave).
  cart_items:
    create:
      added:
        one: "%{product} foi adicionado ao carrinho."
        other: "%{count} unidades de %{product} foram adicionadas ao carrinho."
      invalid_quantity: "Escolha uma quantidade de 1 a %{max}."
    update:
      updated: "Quantidade atualizada."
      invalid_quantity: "Escolha uma quantidade de 1 a %{max}."
    destroy:
      removed: "Produto removido do carrinho."
  users:
    registrations:
      destroy:
        wrong_password: "Senha incorreta. A conta não foi excluída."

  # Textos de views (t(".chave") num partial procura em pasta.partial.chave).
  carts:
    line:
      stock_left:
        one: "Só resta 1 unidade em estoque. Ajuste a quantidade."
        other: "Só restam %{count} unidades em estoque. Ajuste a quantidade."

  # Mensagens do Devise que trocamos (as demais vêm da gem devise-i18n).
  devise:
    registrations:
      destroyed: "Sua conta foi excluída, junto com o seu e-mail, a sua senha e o seu carrinho."
